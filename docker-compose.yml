services:
  env-hub:
    image: ghcr.io/xmzo/env-hub:latest
    restart: unless-stopped
    ports:
      - "9800:9800"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - LISTEN_ADDR=:9800
      - TURNSTILE_KEYS=${TURNSTILE_KEYS}
      - ENV_HUB_IMAGE=ghcr.io/xmzo/env-hub:latest
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

networks:
  app-net:
    enable_ipv6: true
